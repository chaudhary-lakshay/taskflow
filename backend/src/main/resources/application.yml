spring:
  application:
    name: taskflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

taskflow:
  jwt:
    # base64, at least 32 bytes, e.g. `openssl rand -base64 32`. No default: startup fails without it.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:taskflow}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  demo:
    password: ${DEMO_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
