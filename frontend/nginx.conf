server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # same origin for the browser: the API is forwarded to the backend service (not published on the host)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # single-page app: unknown paths (/projects/5) get index.html; real files are served as they are
    location / {
        try_files $uri /index.html;
    }
}
